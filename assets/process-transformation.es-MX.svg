<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc" xml:lang="es-MX">
<title id="title">Preparación de pedidos: antes y después</title>
<desc id="desc">La preparación manual repetía consultas, cálculos, organización y formato. El rediseño aplica reglas a datos estructurados y prepara información revisable y archivos para importar al ERP. Las personas conservan la revisión, las entregas y las decisiones. La carga al ERP es independiente y su aceptación no está verificada. Vista abreviada para pantallas estrechas.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mobile{display:none}@media(max-width:600px){.desktop{display:none}.mobile{display:inline}}</style>
