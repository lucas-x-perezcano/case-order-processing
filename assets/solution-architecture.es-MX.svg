<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc" xml:lang="es-MX">
<title id="title">Arquitectura de preparación</title>
<desc id="desc">Un reporte estructurado y el catálogo maestro alimentan la preparación determinista, el libro de revisión en Excel y los archivos de texto para importación al ERP. Las personas revisan y guardan cambios; la carga al ERP es un paso independiente. Su aceptación no está verificada. La exportación no repite todas las validaciones. El comportamiento descrito proviene de inspección del código; no demuestra ejecución ni aceptación. Vista abreviada para pantallas estrechas.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mobile{display:none}@media(max-width:600px){.desktop{display:none}.mobile{display:inline}}</style>
