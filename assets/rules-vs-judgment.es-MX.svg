<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" xml:lang="es-MX">
<title id="title">Reglas y criterio operativo</title>
<desc id="desc">Matriz de responsabilidades complementarias. La aplicación revisa entradas, cruza el catálogo, enriquece datos, agrupa pedidos, realiza validaciones específicas y prepara archivos. Las personas obtienen el reporte, mantienen el catálogo, aportan entregas, resuelven excepciones, toman decisiones y controlan la carga al ERP. Las advertencias no imponen una aprobación obligatoria. Vista abreviada para pantallas estrechas.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mobile{display:none}@media(max-width:600px){.desktop{display:none}.mobile{display:inline}}</style>
<rect x="1" y="1" width="1198" height="558" rx="18" fill="#FFFFFF" stroke="#D7E1E5" />
