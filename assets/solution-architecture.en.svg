<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Preparation architecture</title>
<desc id="desc">A structured report and master catalog feed deterministic preparation, an Excel review workbook, and text files for ERP import. People review and save edits. ERP loading is a separate boundary and acceptance is unverified. Export does not rerun all checks. This describes source-inspected behavior, not demonstrated execution or ERP acceptance. A condensed view is provided for narrow displays.</desc>
